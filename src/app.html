<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0c0c" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="feega" />
    <link
      rel="preload"
      href="/fonts/bdo-grotesk-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>@font-face { font-family: "BDO Grotesk"; font-weight: 600; font-display: block; src: url("/fonts/bdo-grotesk-DemiBold.woff2") format("woff2"); }</style>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        wait_for_update: 500
      });
    </script>
    <script>document.documentElement.setAttribute('data-hydrating', '');</script>
    <script>(function(u){if(u.includes('FeegaNative/')&&u.includes('Electron/'))document.documentElement.setAttribute('data-window',u.includes('Macintosh')?'mac':'overlay')})(navigator.userAgent);</script>
    <script>(function(r){if(r.getAttribute('data-theme'))return;var s=null;try{s=localStorage.getItem('theme')}catch(e){}r.setAttribute('data-theme',s==='light'||s==='dark'?s:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')})(document.documentElement);</script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="canvas-splash" hidden>
      <style>
        #canvas-splash { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #ffffff; }
        #canvas-splash[hidden] { display: none; }
        #canvas-splash span { font-family: "BDO Grotesk", -apple-system, BlinkMacSystemFont, sans-serif; font-size: 40px; font-weight: 600; line-height: 1; letter-spacing: -0.02em; color: #141414; }
        #canvas-splash svg { fill: #ff5100; }
        #canvas-splash i { width: 180px; height: 4px; border-radius: 9999px; background: color-mix(in srgb, #1d1d1f 10%, transparent); }
        [data-theme="dark"] #canvas-splash { background: #000000; }
        [data-theme="dark"] #canvas-splash span { color: #f2f2f2; }
        [data-theme="dark"] #canvas-splash i { background: color-mix(in srgb, #ededed 10%, transparent); }
      </style>
      <svg width="48" height="48" viewBox="0 0 300 300" aria-hidden="true"><path d="M61.87 142.25A57 57 0 1 1 136.13 142.25A69.5 69.5 0 0 0 61.87 142.25Z" transform="rotate(0 150 150)"/><path d="M61.87 142.25A57 57 0 1 1 136.13 142.25A69.5 69.5 0 0 0 61.87 142.25Z" transform="rotate(90 150 150)"/><path d="M61.87 142.25A57 57 0 1 1 136.13 142.25A69.5 69.5 0 0 0 61.87 142.25Z" transform="rotate(180 150 150)"/><path d="M61.87 142.25A57 57 0 1 1 136.13 142.25A69.5 69.5 0 0 0 61.87 142.25Z" transform="rotate(270 150 150)"/></svg><span>feega</span><i></i>
    </div>
    <script>if (/^\/p\/[^/]+\/c\/[^/]+\/?$/.test(location.pathname)) { const splash = document.getElementById('canvas-splash'); splash.hidden = false; setTimeout(() => splash.remove(), 10000); }</script>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
