name: Desktop release

on:
  push:
    tags: ['desktop-v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - working-directory: apps/desktop
        run: |
          npm ci
          npm test
          npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#desktop-v}"
          npm run build:mac
      - name: Checksums
        working-directory: apps/desktop/dist
        run: shasum -a 256 *.dmg *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Attach to the release
        working-directory: apps/desktop/dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "feega desktop ${GITHUB_REF_NAME#desktop-v}" --latest=false --notes "Unsigned macOS build. Install guide: https://docs.feega.app/desktop/install-macos/"
          gh release upload "$GITHUB_REF_NAME" *.dmg *.zip SHA256SUMS.txt --clobber
