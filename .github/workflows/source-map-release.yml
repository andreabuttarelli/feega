name: Source map release (feega-source-map)

on:
  push:
    branches: [main]
    paths: ['packages/source-map/**']
    tags: ['source-map-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/source-map
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci --workspace packages/source-map --include-workspace-root=false --ignore-scripts
        working-directory: .
      - name: Publish unless this version is already on npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "feega-source-map@$V" version >/dev/null 2>&1; then
            echo "feega-source-map@$V is already on npm"
            exit 0
          fi
          npm publish --access public
