# Every push to main ships `npx feega`: a GitHub release app-v<version> carrying the bundle,
# then the npm package at the same version, then the macOS app (dmg + zip, both arches,
# ad-hoc signed) and SHA256SUMS.txt on that same release; the app updates from these releases. The version lives in the app-v* tags only: the
# next one is the newest tag with its patch bumped (npx/package.json seeds the first). Nothing
# is committed back to main. A rerun on the same commit reuses that commit's tag and skips
# whatever already landed; the asset is uploaded before npm publish, so a failure never leaves
# an npm version without its bundle. workflow_dispatch from any branch only builds the bundle.
name: App release (npx feega)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      PUBLIC_SUPABASE_URL: http://supabase.invalid
      PUBLIC_SUPABASE_ANON_KEY: local
      PUBLISH: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Verify npm token before anything irreversible
        if: env.PUBLISH == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not set. Add it in Settings → Secrets → Actions."
            exit 1
          fi
          npm whoami

      - name: Pick the version
        id: version
        run: |
          OWN=$(git tag --points-at HEAD 'app-v*' | head -1)
          LAST=$(git tag -l 'app-v*' --sort=-v:refname | head -1)
          if [ -n "$OWN" ]; then
            V="${OWN#app-v}"
          elif [ -n "$LAST" ]; then
            V=$(echo "${LAST#app-v}" | awk -F. '{ print $1 "." $2 "." $3 + 1 }')
          else
            V=$(node -p 'require("./npx/package.json").version')
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Version $V"

      - run: npm ci

      - name: Launcher tests
        run: npx vitest run npx

      - name: Build the bundle
        run: scripts/app-bundle.sh dist-app

      - name: Upload bundle (manual runs)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: feega-app
          path: dist-app/feega-app.tar.gz

      - name: GitHub release with the bundle
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "app-v$V" >/dev/null 2>&1; then
            gh release upload "app-v$V" dist-app/feega-app.tar.gz --clobber
          else
            gh release create "app-v$V" dist-app/feega-app.tar.gz --target "$GITHUB_SHA" \
              --title "feega app $V" --notes "Bundle for \`npx feega\`."
          fi

      - name: Publish to npm
        if: env.PUBLISH == 'true'
        working-directory: npx
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          V: ${{ steps.version.outputs.version }}
        run: |
          if npm view "feega@$V" version >/dev/null 2>&1; then
            echo "feega@$V already on npm"
            exit 0
          fi
          npm version --no-git-tag-version --allow-same-version "$V"
          npm publish --access public

  desktop:
    needs: release
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      PUBLIC_SUPABASE_URL: http://supabase.invalid
      PUBLIC_SUPABASE_ANON_KEY: local
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the macOS app at the npm version
        working-directory: apps/desktop
        env:
          V: ${{ needs.release.outputs.version }}
        run: |
          npm ci
          npm test
          npm version --no-git-tag-version --allow-same-version "$V"
          node scripts/stage-server.cjs --arch=${{ matrix.arch }}
          npm run build:native
          npx electron-builder --mac --${{ matrix.arch }} --publish never
          test -f dist/mac*/Feega.app/Contents/Resources/app.asar.unpacked/native/feega_native_canvas.node

      - uses: actions/upload-artifact@v4
        with:
          name: feega-macos-${{ matrix.arch }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip

  desktop-release:
    needs: [release, desktop]
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/main' }}
      V: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: feega-macos-*
          merge-multiple: true
          path: mac

      - name: Checksums
        working-directory: mac
        run: sha256sum *.dmg *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Upload checksums (manual runs)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: feega-macos-sums
          path: mac/SHA256SUMS.txt

      - name: Attach the app to the release
        if: env.PUBLISH == 'true'
        working-directory: mac
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "app-v$V" *.dmg *.zip SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "app-v$V" --repo "$GITHUB_REPOSITORY" --notes "Bundle for \`npx feega\`. macOS app (unsigned): [install guide](https://docs.feega.app/desktop/install-macos/), checksums in SHA256SUMS.txt."
