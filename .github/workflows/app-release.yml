# Ships `npx feega`, the Feega editor for a local web app, from npx/. The version is the one in
# npx/package.json: a version already on npm is skipped, so pushes that do not bump it publish
# nothing. Every run builds and tests the package (unit tests, then the CLI on landing/ driven by
# Playwright); it publishes on a push to main, or on a manual run with publish=true.
name: App release (npx feega)

on:
  push:
    branches: [main]
    paths: ['npx/**', 'inspect/**', 'packages/live-edit/**', 'packages/source-map/**', 'packages/dev-run/**', '.github/workflows/app-release.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: app-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/main' || inputs.publish == true }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Verify npm token before anything irreversible
        if: env.PUBLISH == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not set. Add it in Settings → Secrets → Actions."
            exit 1
          fi
          npm whoami

      - run: npm ci

      - name: Unit tests
        run: npx vitest run inspect/src npx/src

      - name: Build
        run: node npx/build.mjs

      - name: CLI on landing/, driven by Playwright
        run: |
          (cd landing && npm ci --no-audit --no-fund)
          npx playwright install --with-deps chromium
          node npx/test/editor.e2e.mjs

      - name: Pack
        working-directory: npx
        run: |
          npm pack --dry-run
          node dist/cli.cjs --help

      - name: Publish to npm
        if: env.PUBLISH == 'true'
        working-directory: npx
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          V=$(node -p 'require("./package.json").version')
          if npm view "feega@$V" version >/dev/null 2>&1; then
            echo "feega@$V already on npm"
            exit 0
          fi
          npm publish --access public
