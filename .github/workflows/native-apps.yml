name: Native apps

on:
  pull_request:
    paths: ['apps/**', '.github/workflows/native-apps.yml']
  push:
    branches: [dev]
    paths: ['apps/**', '.github/workflows/native-apps.yml']

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build

  desktop-native:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/native
      - run: npm ci
      - run: npm run build:native:universal
      - run: lipo -archs native/feega_native_canvas.node
      - run: npm run build:mac:universal

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: bash scripts/vendor-capacitor.sh
      - run: mkdir -p www && echo '<!doctype html>' > www/index.html && npx cap sync ios
      - run: npm run ios:sim

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: mkdir -p www && echo '<!doctype html>' > www/index.html && npx cap sync android
      - run: cd android && ./gradlew assembleDebug
