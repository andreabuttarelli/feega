name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ matrix.project }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: feega
            id: prj_2XbPjehleZ9ulUYweIMKtmcjzOHC
            paths: ". :!cli :!changelog :!docs :!apps :!imgs :!supabase :!landing :!web-docs :!web-blog"
          - project: feega-mcp
            id: prj_jIZAq6VubJUwWAGloDr6pNAkjeln
            paths: "cli"
          - project: web-docs
            id: prj_spuvPDXx0Lfoxc7sEuWKCCm2AkPZ
            paths: "web-docs docs src/routes/api src/lib/server"
          - project: web-blog
            id: prj_BoTkXM9Cx4NCXcjVGfOJMIx5W8iz
            paths: "web-blog"
    env:
      VERCEL_ORG_ID: team_wWk9EtwETritPiiIdh0CHqua
      VERCEL_PROJECT_ID: ${{ matrix.id }}
      NODE_OPTIONS: --max-old-space-size=7168
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Skip when nothing it ships changed
        id: changed
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ] || ! git diff --quiet HEAD^ HEAD -- ${{ matrix.paths }}; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.deploy == 'true'
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        if: steps.changed.outputs.deploy == 'true'

      - name: Build and deploy
        if: steps.changed.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN"
