name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Boot-minimal placeholders: the e2e smoke tier runs against `vite dev` with no real
      # Supabase (see tests/e2e/README.md). Unit tests do not depend on these values.
      PUBLIC_SUPABASE_URL: http://localhost:54321
      PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Runtime type gate
        run: node scripts/typecheck-runtime.mjs

      - name: Build
        run: npx vite build && rm -rf .vercel/output build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npx vitest run

      - name: E2E smoke tests
        run: npx playwright test

  gpu-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/gpu-core
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/gpu-core

      - name: CPU tests (display list, scene building)
        run: cargo test --locked

      - name: Web build compiles
        run: cargo build --locked --lib --target wasm32-unknown-unknown

  gpu-text:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/gpu-text
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/gpu-text

      - name: Faces, face book and layout
        run: cargo test --locked

      - name: Web build compiles
        run: cargo build --locked --lib --target wasm32-unknown-unknown

  schema-drift:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      PUBLIC_SUPABASE_URL: ${{ secrets.DRIFT_SUPABASE_URL }}
      PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.DRIFT_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Schema drift against production (anon key, zero rows read)
        run: |
          if [ -z "$PUBLIC_SUPABASE_URL" ]; then
            echo "::warning::DRIFT_SUPABASE_URL / DRIFT_SUPABASE_ANON_KEY secrets not set; drift check skipped"
            exit 0
          fi
          node scripts/schema-drift-check.mjs
