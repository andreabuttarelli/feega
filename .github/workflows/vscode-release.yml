name: VS Code extension release

on:
  push:
    tags: ['vscode-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx svelte-kit sync
      - run: npx vitest run inspect/src packages
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        working-directory: inspect
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#vscode-v}"
      - run: node build.mjs
        working-directory: inspect
      - run: npx -y @vscode/vsce@3 package --no-dependencies -o feega.vsix --baseImagesUrl "https://raw.githubusercontent.com/andreabuttarelli/feega/${GITHUB_REF_NAME}/inspect"
        working-directory: inspect
      - name: Visual Studio Marketplace
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        working-directory: inspect
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx -y @vscode/vsce@3 publish --no-dependencies --packagePath feega.vsix
      - name: Open VSX
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        working-directory: inspect
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::OVSX_PAT is not set: skipped Open VSX"
            exit 0
          fi
          PUBLISHER=$(node -p "require('./package.json').publisher")
          npx -y ovsx create-namespace "$PUBLISHER" -p "$OVSX_PAT" || echo "namespace $PUBLISHER already exists"
          npx -y ovsx publish feega.vsix -p "$OVSX_PAT"
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        working-directory: inspect
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" feega.vsix --title "Feega for VS Code ${GITHUB_REF_NAME#vscode-v}" --notes-file CHANGELOG.md || gh release upload "$GITHUB_REF_NAME" feega.vsix --clobber
