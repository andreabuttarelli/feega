<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>feega canvas spike</title>
<style>
  :root { --bg: #f6f6f7; --panel: #ffffff; --line: #e4e4e7; --ink: #18181b; --mute: #71717a; --accent: #6366f1; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font: 13px -apple-system, system-ui, sans-serif; color: var(--ink); overflow: hidden; }
  body { background: transparent; display: grid; grid-template: 48px 1fr / 240px 1fr 280px; }
  body.web { background: var(--bg); }
  header { grid-column: 1 / 4; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 6px; padding: 0 12px; -webkit-app-region: drag; padding-left: 80px; }
  header button, header span { -webkit-app-region: no-drag; }
  button { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; height: 30px; padding: 0 10px; font: inherit; cursor: pointer; }
  button.on { background: var(--ink); color: #fff; }
  #mode { margin-left: auto; color: var(--mute); }
  #fps { font-variant-numeric: tabular-nums; color: var(--mute); width: 230px; text-align: right; }
  aside { background: var(--panel); overflow: auto; }
  #layers { border-right: 1px solid var(--line); }
  #props { border-left: 1px solid var(--line); padding: 12px; }
  .row { padding: 6px 12px; cursor: pointer; display: flex; justify-content: space-between; }
  .row:hover { background: #f4f4f5; }
  .row.sel { background: #eef2ff; color: var(--accent); }
  .row small { color: var(--mute); }
  h4 { margin: 12px 12px 6px; font-size: 11px; text-transform: uppercase; color: var(--mute); letter-spacing: .04em; }
  #stage { position: relative; overflow: hidden; }
  body.web #stage { background: #e9e9ec; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #sel { position: absolute; border: 2px solid var(--accent); pointer-events: none; display: none; }
  #sel span { position: absolute; top: -22px; left: -2px; background: var(--accent); color: #fff; padding: 2px 6px; border-radius: 2px; font-size: 11px; white-space: nowrap; }
  dl { display: grid; grid-template-columns: 80px 1fr; gap: 8px; margin: 0; }
  dt { color: var(--mute); }
  dd { margin: 0; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
  <button id="tSelect" class="on">Select</button>
  <button id="tHand">Hand</button>
  <button id="tFit">Fit</button>
  <button id="t100">100%</button>
  <button id="tMotion">Play motion</button>
  <button id="tBench">Run bench</button>
  <span id="mode"></span>
  <span id="fps"></span>
</header>
<aside id="layers"><h4>Frames</h4><div id="list"></div></aside>
<main id="stage"><div id="sel"><span></span></div></main>
<aside id="props"><h4 style="margin-left:0">Properties</h4><dl id="dl"><dt>Selection</dt><dd>none</dd></dl></aside>
<script type="module" src="app.js"></script>
</body>
</html>
