[package]
name = "feega-native-canvas"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
gpu-core = { path = "../../../packages/gpu-core" }
vello = "0.11.0"
serde_json = "1"
napi = { version = "2", default-features = false, features = ["napi6"] }
napi-derive = "2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSView", "NSResponder", "NSGraphics", "NSBox", "NSColor", "NSCell", "NSText"] }
raw-window-handle = "0.6"
pollster = "0.4"
png = "0.17"

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
