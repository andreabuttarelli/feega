name: feega_motion
description: Embed an interactive feega motion video in a Flutter app. Runs the same hosted player as the web, wired to scroll, visibility, tilt and links.
version: 0.1.0
homepage: https://feega.app
repository: https://github.com/andreabuttarelli/feega/tree/main/packages/feega_motion_flutter
topics: [video, animation, webview, embed]

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.0
  sensors_plus: ^7.0.0
  visibility_detector: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  webview_flutter_platform_interface: ^2.10.0
