[package]
name = "gpu-text"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
harfrust = "0.12.0"
parley = { version = "0.12.0", default-features = false, features = ["std"] }
skrifa = "0.44.0"
wuff = "0.2.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = "s"
lto = true
