[package]
name = "gpu-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "gpu-core-render"
path = "src/main.rs"

[[bin]]
name = "gpu-core-export"
path = "src/export.rs"

[features]
gpu = []

[dependencies]
vello = "0.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gpu-text = { path = "../gpu-text" }
pollster = "0.4"
png = "0.17"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "HtmlImageElement", "HtmlVideoElement", "ImageBitmap", "WebGl2RenderingContext", "WebGlTexture", "WebGlFramebuffer", "WebGlProgram", "WebGlShader", "WebGlUniformLocation", "WebGlVertexArrayObject"] }
vello_hybrid = { version = "0.2.0", default-features = false, features = ["webgl"] }
vello_common = "0.2.0"
js-sys = "0.3"

[profile.release]
opt-level = "s"
lto = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
