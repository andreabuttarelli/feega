[package]
name = "gpu-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "gpu-core-render"
path = "src/main.rs"

[[bin]]
name = "gpu-core-export"
path = "src/export.rs"

[features]
gpu = []
webgl = ["dep:vello_hybrid", "dep:vello_common"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustc-hash = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello = { version = "0.12.0", features = ["bump_estimate"] }
gpu-text = { path = "../gpu-text" }
pollster = "0.4"
png = "0.17"

[target.'cfg(target_arch = "wasm32")'.dependencies]
vello = { version = "0.12.0", default-features = false, features = ["wgpu", "glyphless", "bump_estimate"] }
wgpu = { version = "30.0.0", default-features = false, features = ["std", "wgsl", "webgpu"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "HtmlImageElement", "HtmlVideoElement", "ImageBitmap", "WebGl2RenderingContext", "WebGlTexture", "WebGlFramebuffer", "WebGlProgram", "WebGlShader", "WebGlUniformLocation", "WebGlVertexArrayObject"] }
vello_hybrid = { version = "0.2.0", default-features = false, features = ["webgl"], optional = true }
vello_common = { version = "0.2.0", optional = true }
js-sys = "0.3"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
vello = { path = "vendor/vello" }
vello_encoding = { path = "vendor/vello_encoding" }
