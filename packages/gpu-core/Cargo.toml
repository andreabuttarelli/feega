[package]
name = "gpu-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "gpu-core-render"
path = "src/main.rs"

[dependencies]
vello = "0.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pollster = "0.4"
png = "0.17"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
