<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="#FF5100"><style>svg{--d:5s;--e:cubic-bezier(.3,1.3,.4,1)}.all{transform-origin:150px 150px;animation:spin var(--d) var(--e) infinite}.c,.k{transform-box:fill-box;transform-origin:center;animation-duration:var(--d);animation-timing-function:var(--e);animation-iteration-count:infinite}@keyframes spin{0%{transform:scale(0) rotate(-90deg)}8%,14%{transform:scale(1) rotate(-90deg)}40%,84%{transform:scale(1) rotate(0)}95%{transform:scale(1) rotate(90deg)}100%{transform:scale(0) rotate(90deg)}}.c.tl{animation-name:c-tl}.k.tl{animation-name:k-tl}@keyframes c-tl{0%,14%{transform:translate(51px,51px)}40%,84%{transform:none}95%,100%{transform:translate(51px,51px)}}@keyframes k-tl{0%,14%{transform:translate(51px,51px) scale(0)}40%,84%{transform:none}95%,100%{transform:translate(51px,51px) scale(0)}}.c.tr{animation-name:c-tr}.k.tr{animation-name:k-tr}@keyframes c-tr{0%,14%{transform:translate(-51px,51px)}40%,84%{transform:none}95%,100%{transform:translate(-51px,51px)}}@keyframes k-tr{0%,14%{transform:translate(-51px,51px) scale(0)}40%,84%{transform:none}95%,100%{transform:translate(-51px,51px) scale(0)}}.c.br{animation-name:c-br}.k.br{animation-name:k-br}@keyframes c-br{0%,14%{transform:translate(-51px,-51px)}40%,84%{transform:none}95%,100%{transform:translate(-51px,-51px)}}@keyframes k-br{0%,14%{transform:translate(-51px,-51px) scale(0)}40%,84%{transform:none}95%,100%{transform:translate(-51px,-51px) scale(0)}}.c.bl{animation-name:c-bl}.k.bl{animation-name:k-bl}@keyframes c-bl{0%,14%{transform:translate(51px,-51px)}40%,84%{transform:none}95%,100%{transform:translate(51px,-51px)}}@keyframes k-bl{0%,14%{transform:translate(51px,-51px) scale(0)}40%,84%{transform:none}95%,100%{transform:translate(51px,-51px) scale(0)}}@media (prefers-reduced-motion:reduce){.all,.c,.k{animation:none}}</style><defs><mask id="m-tl" maskUnits="userSpaceOnUse" x="-150" y="-150" width="600" height="600"><rect x="-150" y="-150" width="600" height="600" fill="#fff"/><circle class="k bl" cx="99" cy="201" r="69.5" fill="#000"/></mask><mask id="m-tr" maskUnits="userSpaceOnUse" x="-150" y="-150" width="600" height="600"><rect x="-150" y="-150" width="600" height="600" fill="#fff"/><circle class="k tl" cx="99" cy="99" r="69.5" fill="#000"/></mask><mask id="m-br" maskUnits="userSpaceOnUse" x="-150" y="-150" width="600" height="600"><rect x="-150" y="-150" width="600" height="600" fill="#fff"/><circle class="k tr" cx="201" cy="99" r="69.5" fill="#000"/></mask><mask id="m-bl" maskUnits="userSpaceOnUse" x="-150" y="-150" width="600" height="600"><rect x="-150" y="-150" width="600" height="600" fill="#fff"/><circle class="k br" cx="201" cy="201" r="69.5" fill="#000"/></mask></defs><g class="all"><g mask="url(#m-tl)"><circle class="c tl" cx="99" cy="99" r="57"/></g><g mask="url(#m-tr)"><circle class="c tr" cx="201" cy="99" r="57"/></g><g mask="url(#m-br)"><circle class="c br" cx="201" cy="201" r="57"/></g><g mask="url(#m-bl)"><circle class="c bl" cx="99" cy="201" r="57"/></g></g></svg>
